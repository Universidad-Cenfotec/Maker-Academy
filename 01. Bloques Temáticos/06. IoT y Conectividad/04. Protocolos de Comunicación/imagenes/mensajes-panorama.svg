<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">El aviso del estante llega a la mesa de materiales</title>
<desc id="desc">Tres tarjetas muestran que faltan lápices en el estante A, que el aviso se comparte y que la mesa de materiales lo recibe para revisar y reponer.</desc>
<rect width="1200" height="600" fill="#F5F8FC"/>
<rect width="1200" height="16" fill="#164A98"/>
<text x="64" y="78" fill="#164A98" font-size="38" font-weight="700" font-family="Arial, sans-serif">Un aviso que sirve para actuar</text>
<text x="64" y="120" fill="#4A5664" font-size="23" font-family="Arial, sans-serif">Estante de materiales del aula · ejemplo simulado</text>
<g font-family="Arial, sans-serif">
<rect x="64" y="174" width="320" height="252" rx="24" fill="white" stroke="#9CC8FF" stroke-width="3"/>
<rect x="440" y="174" width="320" height="252" rx="24" fill="white" stroke="#9CC8FF" stroke-width="3"/>
<rect x="816" y="174" width="320" height="252" rx="24" fill="white" stroke="#9CC8FF" stroke-width="3"/>
<circle cx="112" cy="226" r="24" fill="#164A98"/><text x="104" y="235" fill="white" font-size="25" font-weight="700">1</text>
<circle cx="488" cy="226" r="24" fill="#164A98"/><text x="480" y="235" fill="white" font-size="25" font-weight="700">2</text>
<circle cx="864" cy="226" r="24" fill="#164A98"/><text x="856" y="235" fill="white" font-size="25" font-weight="700">3</text>
<text x="92" y="288" fill="#164A98" font-size="30" font-weight="700">Estante A</text>
<text x="92" y="334" fill="#243241" font-size="25">Faltan lápices</text>
<text x="92" y="372" fill="#4A5664" font-size="21">Detecta una necesidad</text>
<text x="468" y="288" fill="#164A98" font-size="30" font-weight="700">Mensaje</text>
<text x="468" y="334" fill="#243241" font-size="24">«Faltan lápices</text>
<text x="468" y="370" fill="#243241" font-size="24">en el estante A»</text>
<text x="844" y="278" fill="#164A98" font-size="29" font-weight="700">Mesa de</text>
<text x="844" y="311" fill="#164A98" font-size="29" font-weight="700">materiales</text>
<text x="844" y="355" fill="#243241" font-size="25">Recibe el aviso</text>
<text x="844" y="392" fill="#4A5664" font-size="21">Revisa y repone</text>
<path d="M391 300h34m-10-10 10 10-10 10M767 300h34m-10-10 10 10-10 10" fill="none" stroke="#006AEA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="64" y="464" width="1072" height="90" rx="18" fill="#E4F0FF"/>
<text x="91" y="502" fill="#164A98" font-size="24" font-weight="700">Preguntas para el grupo</text>
<text x="91" y="536" fill="#243241" font-size="22">¿Quién avisa?      ¿Qué dice?      ¿Quién lo necesita?      ¿Qué comprobamos después?</text>
</g></svg>
