<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-labelledby="title desc"><title id="title">Solicitud web y comprobación del LED</title><desc id="desc">El navegador envía una petición al servidor ESP32. Se comprueban por separado la respuesta y la luz observada.</desc><rect width="940" height="340" fill="#f4f8ff"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#164A98">¿Se encendió de verdad?</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="40" y="100" width="245" height="120" rx="15" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="162" y="145" font-size="21" fill="#164A98">Navegador</text><text x="162" y="180" font-size="17" fill="#303a46">Solicita encender</text><rect x="345" y="100" width="245" height="120" rx="15" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="467" y="145" font-size="21" fill="#164A98">ESP32</text><text x="467" y="180" font-size="17" fill="#303a46">Valida y responde</text><rect x="650" y="100" width="245" height="120" rx="15" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="772" y="145" font-size="21" fill="#164A98">LED</text><text x="772" y="180" font-size="17" fill="#303a46">Observar la luz</text></g><path d="M285 160h55m250 0h55" stroke="#164A98" stroke-width="4"/><path d="m337 151 12 9-12 9m305-18 12 9-12 9" fill="none" stroke="#164A98" stroke-width="4"/><text x="40" y="280" font-family="Arial,sans-serif" font-size="18" fill="#303a46">Pulsar ≠ recibir respuesta ≠ comprobar físicamente la salida.</text><text x="40" y="312" font-family="Arial,sans-serif" font-size="16" fill="#164A98">Tras desconexión, la página puede mostrar un estado anterior.</text></svg>
