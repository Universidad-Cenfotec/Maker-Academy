<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="title desc"><title id="title">Tablero y vigencia de una lectura</title><desc id="desc">Una tarjeta actualizada contiene valor, unidad, lugar y hora; otra conserva la última lectura pero indica que no hay actualización.</desc><rect width="920" height="350" fill="#f4f8ff"/><text x="45" y="50" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#164A98">¿De cuándo es este dato?</text><rect x="45" y="85" width="390" height="210" rx="16" fill="#fff" stroke="#006AEA" stroke-width="3"/><rect x="485" y="85" width="390" height="210" rx="16" fill="#fff" stroke="#7C7B75" stroke-width="3"/><text x="70" y="120" font-family="Arial,sans-serif" font-size="18" fill="#164A98">ACTUALIZADO</text><text x="70" y="190" font-family="Arial,sans-serif" font-size="52" font-weight="bold" fill="#164A98">24,1 °C</text><text x="70" y="245" font-family="Arial,sans-serif" font-size="21" fill="#303a46">Makerspace · 10:03</text><text x="510" y="120" font-family="Arial,sans-serif" font-size="18" fill="#4f5660">SIN ACTUALIZACIÓN</text><text x="510" y="190" font-family="Arial,sans-serif" font-size="40" font-weight="bold" fill="#4f5660">24,1 °C</text><text x="510" y="245" font-family="Arial,sans-serif" font-size="20" fill="#303a46">Última lectura: 10:03</text><text x="510" y="275" font-family="Arial,sans-serif" font-size="16" fill="#4f5660">Ahora son las 10:12 · valor histórico</text><text x="45" y="328" font-family="Arial,sans-serif" font-size="17" fill="#164A98">El número puede permanecer; su significado cambia con el tiempo.</text></svg>
