<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Recorrido de una lectura a un registro remoto</title><desc id="desc">Medir, validar, enviar y comprobar el registro son pasos diferentes. Una lectura sin red no aparece en el servicio.</desc><rect width="960" height="360" fill="#f4f8ff"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#164A98">¿Qué llegó al registro?</text><g font-family="Arial,sans-serif" text-anchor="middle" fill="#164A98" font-size="21"><rect x="35" y="95" width="200" height="98" rx="14" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="135" y="150">Medir</text><rect x="265" y="95" width="200" height="98" rx="14" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="365" y="150">Validar</text><rect x="495" y="95" width="200" height="98" rx="14" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="595" y="150">Enviar</text><rect x="725" y="95" width="200" height="98" rx="14" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="825" y="150">Confirmar</text></g><path d="M236 145h28m202 0h28m202 0h28" stroke="#164A98" stroke-width="4"/><text x="35" y="245" font-family="Arial,sans-serif" font-size="19" fill="#303a46">A: confirmado · B: sin red · C: sin lectura válida · D: confirmado</text><rect x="35" y="270" width="890" height="52" rx="10" fill="#e4efff"/><text x="52" y="304" font-family="Arial,sans-serif" font-size="18" fill="#164A98">El hueco entre A y D se documenta: B y C tienen causas distintas.</text></svg>
