<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Estados y pruebas de una alerta ambiental</title><desc id="desc">Una lectura aislada requiere investigar. Dos lecturas consecutivas activan una revisión. Si falta un dato nuevo se indica sin actualización.</desc><rect width="960" height="360" fill="#f4f8ff"/><text x="35" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#164A98">Una alerta que ayuda a decidir</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="90" width="265" height="155" rx="14" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="167" y="134" font-size="21" fill="#164A98">Una lectura diferente</text><text x="167" y="177" font-size="18" fill="#303a46">Investigar y repetir</text><rect x="345" y="90" width="265" height="155" rx="14" fill="#fff" stroke="#006AEA" stroke-width="3"/><text x="477" y="134" font-size="21" fill="#164A98">Dos lecturas seguidas</text><text x="477" y="177" font-size="18" fill="#303a46">Solicitar revisión</text><rect x="655" y="90" width="265" height="155" rx="14" fill="#fff" stroke="#7C7B75" stroke-width="3"/><text x="787" y="134" font-size="21" fill="#4f5660">Sin lectura nueva</text><text x="787" y="177" font-size="18" fill="#303a46">Revisar estación</text></g><text x="35" y="292" font-family="Arial,sans-serif" font-size="19" fill="#303a46">La persona destinataria interpreta, visita el lugar y documenta lo que encontró.</text><text x="35" y="325" font-family="Arial,sans-serif" font-size="16" fill="#164A98">Las cifras de ensayo no son límites de seguridad ni diagnóstico del edificio.</text></svg>
