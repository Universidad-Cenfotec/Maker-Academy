<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">Comparación de un aviso ambiguo y uno claro</title>
<desc id="desc">A la izquierda una tarjeta dice Atención y no indica qué pasó. A la derecha una tarjeta dice Faltan lápices en el estante A, para la mesa de materiales.</desc>
<rect width="1200" height="570" fill="#F5F8FC"/><rect width="1200" height="16" fill="#164A98"/>
<g font-family="Arial, sans-serif">
<text x="64" y="80" fill="#164A98" font-size="38" font-weight="700">¿Qué aviso ayuda a resolver el problema?</text>
<rect x="64" y="137" width="470" height="315" rx="26" fill="white" stroke="#7C7B75" stroke-width="3"/>
<rect x="666" y="137" width="470" height="315" rx="26" fill="white" stroke="#006AEA" stroke-width="4"/>
<rect x="88" y="161" width="196" height="45" rx="12" fill="#ECEDEF"/><text x="106" y="192" fill="#3B454F" font-size="21" font-weight="700">Aviso incompleto</text>
<rect x="690" y="161" width="155" height="45" rx="12" fill="#E4F0FF"/><text x="709" y="192" fill="#164A98" font-size="21" font-weight="700">Aviso claro</text>
<text x="95" y="295" fill="#243241" font-size="42" font-weight="700">«¡Atención!»</text>
<text x="95" y="367" fill="#4A5664" font-size="23">¿Qué ocurrió? ¿Dónde?</text>
<text x="697" y="276" fill="#243241" font-size="34" font-weight="700">«Faltan lápices</text>
<text x="697" y="322" fill="#243241" font-size="34" font-weight="700">en el estante A»</text>
<text x="697" y="389" fill="#4A5664" font-size="22">Para: mesa de materiales</text>
<path d="M553 299h90m-16-15 16 15-16 15" fill="none" stroke="#006AEA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="510" fill="#164A98" font-size="25" font-weight="700">Prueba:</text>
<text x="175" y="510" fill="#243241" font-size="24">entrega la tarjeta a otro equipo y escucha qué entiende.</text>
</g></svg>
