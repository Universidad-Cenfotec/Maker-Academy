<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Una necesidad, tres representaciones en B09</title>
  <desc id="desc">Orientar a una persona visitante se representa primero con flechas probadas por otra persona, luego con una interacción en bloques y después con una función en texto. En cada etapa se predice, prueba y mejora.</desc>
  <rect width="1200" height="380" fill="#9CC8FF"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#164A98">B09 · Una necesidad, distintas formas de programar</text>
  <text x="48" y="84" font-family="Arial, sans-serif" font-size="17" fill="#164A98">¿Cómo ayudamos a una persona visitante a encontrar una estación?</text>
  <g font-family="Arial, sans-serif">
    <rect x="48" y="116" width="338" height="198" rx="16" fill="#D2D2D2" stroke="#164A98" stroke-width="2"/>
    <rect x="431" y="116" width="338" height="198" rx="16" fill="#D2D2D2" stroke="#164A98" stroke-width="2"/>
    <rect x="814" y="116" width="338" height="198" rx="16" fill="#D2D2D2" stroke="#164A98" stroke-width="2"/>
    <text x="72" y="151" font-size="19" font-weight="700" fill="#164A98">1 · Flechas y recorrido</text>
    <text x="455" y="151" font-size="19" font-weight="700" fill="#164A98">2 · Bloques e interacción</text>
    <text x="838" y="151" font-size="19" font-weight="700" fill="#164A98">3 · Texto y pruebas</text>
    <text x="72" y="190" font-size="18" fill="#164A98">INICIO → ↓ → → DESTINO</text>
    <text x="72" y="224" font-size="16" fill="#164A98">Otra persona sigue las tarjetas.</text>
    <text x="72" y="255" font-size="16" fill="#164A98">¿Dónde cambió la ruta?</text>
    <rect x="455" y="174" width="278" height="32" rx="7" fill="#D2D2D2"/>
    <rect x="455" y="211" width="278" height="32" rx="7" fill="#D2D2D2"/>
    <text x="468" y="196" font-size="16" fill="#164A98">al elegir un destino</text>
    <text x="468" y="233" font-size="16" fill="#164A98">mostrar su indicación</text>
    <text x="455" y="275" font-size="16" fill="#164A98">¿Responde a otra elección?</text>
    <rect x="838" y="172" width="287" height="76" rx="8" fill="#D2D2D2"/>
    <text x="852" y="198" font-size="16" fill="#164A98" font-family="monospace">def orientar(destino):</text>
    <text x="852" y="225" font-size="16" fill="#164A98" font-family="monospace">    return rutas.get(destino)</text>
    <text x="838" y="275" font-size="16" fill="#164A98">¿Qué ocurre con un dato nuevo?</text>
    <text x="399" y="228" font-size="26" fill="#006AEA">→</text>
    <text x="782" y="228" font-size="26" fill="#006AEA">→</text>
  </g>
  <rect x="48" y="335" width="1104" height="28" rx="8" fill="#164A98"/>
  <text x="600" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#D2D2D2">En todas las edades: anticipar · probar con otra persona · explicar un cambio</text>
</svg>
