<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="430" viewBox="0 0 1160 430" role="img" aria-labelledby="title desc">
  <title id="title">Dos versiones de una ruta del visitante</title>
  <desc id="desc">En una cuadrícula A a D, filas 1 a 3, la primera ruta desde A1 intenta entrar a B1, que está cerrado. La segunda baja a A2, atraviesa B2, C2 y D2 y baja a D3, donde están los materiales.</desc>
  <rect width="1160" height="430" fill="#f5f8fc"/>
  <text x="42" y="45" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#164A98">La ruta cambió después de probarla</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#183153">
    <text x="45" y="82" font-size="20" font-weight="700" fill="#164A98">Versión 1 · se detiene</text>
    <text x="605" y="82" font-size="20" font-weight="700" fill="#164A98">Versión 2 · rodea el obstáculo</text>
    <text x="96" y="116">A</text><text x="196" y="116">B</text><text x="296" y="116">C</text><text x="396" y="116">D</text>
    <text x="656" y="116">A</text><text x="756" y="116">B</text><text x="856" y="116">C</text><text x="956" y="116">D</text>
    <text x="47" y="161">1</text><text x="47" y="241">2</text><text x="47" y="321">3</text>
    <text x="607" y="161">1</text><text x="607" y="241">2</text><text x="607" y="321">3</text>
  </g>
  <g fill="white" stroke="#9CC8FF" stroke-width="2">
    <path d="M76 128h400v240H76z M636 128h400v240H636z" fill="none"/>
    <path d="M176 128v240 M276 128v240 M376 128v240 M76 208h400 M76 288h400 M736 128v240 M836 128v240 M936 128v240 M636 208h400 M636 288h400" fill="none"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle" font-size="15" font-weight="700">
    <rect x="177" y="129" width="98" height="78" fill="#D2D2D2"/>
    <rect x="737" y="129" width="98" height="78" fill="#D2D2D2"/>
    <text x="226" y="173" fill="#183153">CERRADO</text><text x="786" y="173" fill="#183153">CERRADO</text>
    <text x="126" y="166" fill="#164A98">INICIO</text><text x="686" y="166" fill="#164A98">INICIO</text>
    <text x="426" y="327" fill="#164A98">MATERIALES</text><text x="986" y="327" fill="#164A98">MATERIALES</text>
  </g>
  <path d="M126 171h100" fill="none" stroke="#7C7B75" stroke-width="8" stroke-linecap="round"/>
  <circle cx="226" cy="171" r="12" fill="white" stroke="#7C7B75" stroke-width="5"/>
  <path d="M686 171v80h300v78" fill="none" stroke="#006AEA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="686" cy="171" r="9" fill="#164A98"/><circle cx="986" cy="329" r="9" fill="#164A98"/>
  <text x="45" y="405" font-family="Arial, sans-serif" font-size="16" fill="#334155">A1 → B1: paso bloqueado</text>
  <text x="605" y="405" font-family="Arial, sans-serif" font-size="16" fill="#334155">A1 → A2 → B2 → C2 → D2 → D3</text>
</svg>
