<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Cómo usar una tarjeta de programación de Scratch</title>
  <desc id="desc">Una tarjeta tiene frente con la meta ilustrada, por ejemplo haz que se mueva, y reverso con bloques para empezar: al presionar la bandera, repetir diez, mover diez pasos y tocar sonido. A la derecha, cinco pasos: elegir, predecir, probar, cambiar y mostrar a otra pareja.</desc>
  <rect width="1200" height="500" fill="#9CC8FF"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#164A98">Cómo usar una tarjeta de programación de Scratch</text>
  <text x="48" y="86" font-family="Arial, sans-serif" font-size="17" fill="#164A98">Cada tarjeta tiene un frente con la idea y un reverso con los bloques para empezar.</text>
  <rect x="48" y="112" width="300" height="330" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="48" y="112" width="300" height="56" rx="16" fill="#164A98"/><rect x="48" y="146" width="300" height="22" fill="#164A98"/>
  <text x="198" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#F7F9FC" text-anchor="middle">FRENTE</text>
  <rect x="72" y="188" width="252" height="150" rx="10" fill="#9CC8FF"/>
  <circle cx="150" cy="262" r="30" fill="#E8761A"/>
  <path d="M196 262 h70" stroke="#164A98" stroke-width="4" stroke-dasharray="8 7"/><path d="M268 262 l-12 -8 v16 z" fill="#164A98"/>
  <text x="198" y="372" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="middle">«Haz que se mueva»</text>
  <text x="198" y="400" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#164A98" text-anchor="middle">La meta, con un dibujo</text>
  <rect x="378" y="112" width="300" height="330" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="378" y="112" width="300" height="56" rx="16" fill="#164A98"/><rect x="378" y="146" width="300" height="22" fill="#164A98"/>
  <text x="528" y="148" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#F7F9FC" text-anchor="middle">REVERSO</text>
  <path d="M400 196 q0 -6 6 -6 h14 l6 6 h12 l6 -6 h160 q6 0 6 6 v22 q0 6 -6 6 h-160 l-6 6 h-12 l-6 -6 h-14 q-6 0 -6 -6 z" fill="#F2B705"/>
  <text x="414" y="213.0" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">al presionar ▶</text>
  <path d="M400 240 q0 -6 6 -6 h14 l6 6 h12 l6 -6 h160 q6 0 6 6 v22 q0 6 -6 6 h-160 l-6 6 h-12 l-6 -6 h-14 q-6 0 -6 -6 z" fill="#E8761A"/>
  <text x="414" y="257.0" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">repetir 10</text>
  <path d="M420 284 q0 -6 6 -6 h14 l6 6 h12 l6 -6 h140 q6 0 6 6 v22 q0 6 -6 6 h-140 l-6 6 h-12 l-6 -6 h-14 q-6 0 -6 -6 z" fill="#006AEA"/>
  <text x="434" y="301.0" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">mover 10 pasos</text>
  <path d="M400 328 q0 -6 6 -6 h14 l6 6 h12 l6 -6 h160 q6 0 6 6 v22 q0 6 -6 6 h-160 l-6 6 h-12 l-6 -6 h-14 q-6 0 -6 -6 z" fill="#2E9E5B"/>
  <text x="414" y="345.0" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start">tocar sonido</text>
  <text x="528" y="400" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#164A98" text-anchor="middle">Bloques para empezar + prueba</text>
  <circle cx="736" cy="142" r="20" fill="#164A98"/>
  <text x="736" y="149" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#F7F9FC" text-anchor="middle">1</text>
  <text x="768" y="138" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Elegir</text>
  <text x="768" y="162" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#164A98" text-anchor="start">una tarjeta que sirva al reto del grupo.</text>
  <circle cx="736" cy="206" r="20" fill="#164A98"/>
  <text x="736" y="213" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#F7F9FC" text-anchor="middle">2</text>
  <text x="768" y="202" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Predecir</text>
  <text x="768" y="226" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#164A98" text-anchor="start">qué hará antes de pulsar la bandera.</text>
  <circle cx="736" cy="270" r="20" fill="#164A98"/>
  <text x="736" y="277" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#F7F9FC" text-anchor="middle">3</text>
  <text x="768" y="266" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Probar</text>
  <text x="768" y="290" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#164A98" text-anchor="start">y comparar con lo que esperaban.</text>
  <circle cx="736" cy="334" r="20" fill="#164A98"/>
  <text x="736" y="341" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#F7F9FC" text-anchor="middle">4</text>
  <text x="768" y="330" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Cambiar</text>
  <text x="768" y="354" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#164A98" text-anchor="start">un número o un bloque: «¿y si…?».</text>
  <circle cx="736" cy="398" r="20" fill="#164A98"/>
  <text x="736" y="405" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#F7F9FC" text-anchor="middle">5</text>
  <text x="768" y="394" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Mostrar</text>
  <text x="768" y="418" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#164A98" text-anchor="start">a otra pareja y anotar una mejora.</text>
  <text x="48" y="476" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#164A98" text-anchor="start">Imprima un mazo por mesa o proyecte una tarjeta. Las tarjetas oficiales están en español en scratch.mit.edu/ideas.</text>
</svg>
