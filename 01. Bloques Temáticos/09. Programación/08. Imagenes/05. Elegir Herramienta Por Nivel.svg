<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">Qué herramienta usar en cada nivel de B09</title>
  <desc id="desc">Cinco columnas de preescolar a undécimo. Preescolar: tarjetas, ScratchJr y Pre-reader Express. I Ciclo: ScratchJr, Blockly Laberinto, CS Fundamentals y tarjetas de Scratch. II Ciclo: Scratch con tarjetas, OctoStudio y extensiones de música, lápiz, micro:bit y LEGO. III Ciclo: Scratch con Makey Makey, Sprite Lab o Game Lab, Python Tutor y comparación de bloques con Python. Diversificada: Python Lab, editor local, Python Tutor y proyecto con usuarios. Cada columna indica la evidencia esperada.</desc>
  <rect width="1200" height="510" fill="#9CC8FF"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#164A98">¿Qué herramienta uso en cada nivel?</text>
  <text x="48" y="86" font-family="Arial, sans-serif" font-size="17" fill="#164A98">Sugerencias para B09. El reto del grupo decide; la herramienta es un medio.</text>
