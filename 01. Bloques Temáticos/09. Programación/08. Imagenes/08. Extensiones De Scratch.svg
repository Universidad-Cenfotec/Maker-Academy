<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554" role="img" aria-labelledby="title desc">
  <title id="title">Extensiones de Scratch</title>
  <desc id="desc">Ocho fichas: Música, Lápiz, Texto a voz, Traducir y Sensor de video funcionan en pantalla; micro:bit, LEGO Education con WeDo 2.0, BOOST y EV3, y Makey Makey conectan el proyecto con el mundo físico. Cada ficha da una idea de uso, como un ritmo que avisa la llegada o frutas como botones.</desc>
  <rect width="1200" height="554" fill="#9CC8FF"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#164A98">Extensiones de Scratch: del juego en pantalla al mundo físico</text>
  <text x="48" y="86" font-family="Arial, sans-serif" font-size="17" fill="#164A98">En el editor: botón azul «Añadir extensión» (abajo a la izquierda).</text>
  <rect x="48" y="116" width="262" height="178" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="64" y="132" width="54" height="54" rx="12" fill="#2E9E5B"/>
  <text x="91" y="168" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">♪</text>
  <text x="132" y="158" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Música</text>
  <text x="132" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7C7B75" text-anchor="start">en pantalla</text>
  <text x="64" y="218" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#164A98" text-anchor="start">Tambores, notas y tempo.</text>
  <rect x="60" y="234" width="238" height="46" rx="10" fill="#D2D2D2"/>
  <text x="70" y="253" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">Idea: Crear un ritmo que avise de</text>
  <text x="70" y="271" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">llegada.</text>
  <rect x="328" y="116" width="262" height="178" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="344" y="132" width="54" height="54" rx="12" fill="#1592A3"/>
  <text x="371" y="168" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">✎</text>
  <text x="412" y="158" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Lápiz</text>
  <text x="412" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7C7B75" text-anchor="start">en pantalla</text>
  <text x="344" y="218" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#164A98" text-anchor="start">El personaje dibuja al moverse.</text>
  <rect x="340" y="234" width="238" height="46" rx="10" fill="#D2D2D2"/>
  <text x="350" y="262" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">Idea: Repetir para trazar patrones.</text>
  <rect x="608" y="116" width="262" height="178" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="624" y="132" width="54" height="54" rx="12" fill="#7B4FC9"/>
  <text x="651" y="168" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">❝</text>
  <text x="692" y="158" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Texto a voz</text>
  <text x="692" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7C7B75" text-anchor="start">en pantalla</text>
  <text x="624" y="218" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#164A98" text-anchor="start">El proyecto habla.</text>
  <rect x="620" y="234" width="238" height="46" rx="10" fill="#D2D2D2"/>
  <text x="630" y="262" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">Idea: Una guía que lee en voz alta.</text>
  <rect x="888" y="116" width="262" height="178" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="904" y="132" width="54" height="54" rx="12" fill="#006AEA"/>
  <text x="931" y="168" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Aa</text>
  <text x="972" y="158" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Traducir</text>
  <text x="972" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7C7B75" text-anchor="start">en pantalla</text>
  <text x="904" y="218" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#164A98" text-anchor="start">Cambia el idioma de un mensaje.</text>
  <rect x="900" y="234" width="238" height="46" rx="10" fill="#D2D2D2"/>
  <text x="910" y="253" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">Idea: Recibir a visitantes de</text>
  <text x="910" y="271" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">otro idioma.</text>
  <rect x="48" y="312" width="262" height="178" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="64" y="328" width="54" height="54" rx="12" fill="#E8761A"/>
  <text x="91" y="364" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">◉</text>
  <text x="132" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Sensor de video</text>
  <text x="132" y="376" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#7C7B75" text-anchor="start">en pantalla</text>
  <text x="64" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#164A98" text-anchor="start">Reacciona al movimiento.</text>
  <rect x="60" y="430" width="238" height="46" rx="10" fill="#D2D2D2"/>
  <text x="70" y="458" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">Idea: Saludar al pasar la mano.</text>
  <rect x="328" y="312" width="262" height="178" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="344" y="328" width="54" height="54" rx="12" fill="#164A98"/>
  <text x="371" y="364" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">▦</text>
  <text x="412" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">micro:bit</text>
  <text x="412" y="376" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#006AEA" text-anchor="start">física</text>
  <text x="344" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#164A98" text-anchor="start">Botones, inclinación y luces.</text>
  <rect x="340" y="430" width="238" height="46" rx="10" fill="#D2D2D2"/>
  <text x="350" y="449" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">Idea: Un control físico para el</text>
  <text x="350" y="467" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">juego.</text>
  <rect x="608" y="312" width="262" height="178" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="624" y="328" width="54" height="54" rx="12" fill="#D64545"/>
  <text x="651" y="364" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">▣</text>
  <text x="692" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">LEGO Education</text>
  <text x="692" y="376" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#006AEA" text-anchor="start">física</text>
  <text x="624" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#164A98" text-anchor="start">WeDo 2.0, BOOST y EV3.</text>
  <rect x="620" y="430" width="238" height="46" rx="10" fill="#D2D2D2"/>
  <text x="630" y="449" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">Idea: Motores y sensores en un</text>
  <text x="630" y="467" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">modelo.</text>
  <rect x="888" y="312" width="262" height="178" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <rect x="904" y="328" width="54" height="54" rx="12" fill="#F2B705"/>
  <text x="931" y="364" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">⌁</text>
  <text x="972" y="354" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#164A98" text-anchor="start">Makey Makey</text>
  <text x="972" y="376" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#006AEA" text-anchor="start">física</text>
  <text x="904" y="414" font-family="Arial, sans-serif" font-size="14" font-weight="400" fill="#164A98" text-anchor="start">Objetos conductores como teclas.</text>
  <rect x="900" y="430" width="238" height="46" rx="10" fill="#D2D2D2"/>
  <text x="910" y="449" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">Idea: Frutas o papel aluminio</text>
  <text x="910" y="467" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#164A98" text-anchor="start">como botones.</text>
  <text x="48" y="530" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#164A98" text-anchor="start">Las extensiones físicas necesitan el dispositivo y, según el caso, Scratch Link. Pruébelas en un equipo del centro antes de clase.</text>
</svg>
