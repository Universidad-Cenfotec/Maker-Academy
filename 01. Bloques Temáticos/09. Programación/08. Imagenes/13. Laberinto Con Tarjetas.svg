<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="466" viewBox="0 0 1200 466" role="img" aria-labelledby="title desc">
  <title id="title">Laberinto con tarjetas</title>
  <desc id="desc">Cuadrícula de cinco por cuatro con inicio abajo a la izquierda, un obstáculo y la meta arriba a la derecha. La versión uno, con tres flechas a la derecha y una hacia arriba, choca con el obstáculo en el paso dos. La versión dos, repetir tres veces arriba y repetir cuatro veces a la derecha, llega a la meta. Debajo, el registro pensamos, ocurrió, cambiamos y al probar de nuevo.</desc>
  <rect width="1200" height="466" fill="#9CC8FF"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#164A98">Laberinto con tarjetas: predecir, probar, corregir</text>
  <text x="48" y="86" font-family="Arial, sans-serif" font-size="17" fill="#164A98">Cuadrícula de 5 × 4 dibujada por el grupo · inicio, obstáculo y destino</text>
