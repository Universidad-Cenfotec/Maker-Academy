  <text x="490" y="400" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#164A98" text-anchor="start">Registro: pensamos… · ocurrió… · cambiamos… · al probar de nuevo…</text>
  <text x="490" y="428" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#164A98" text-anchor="start">Otra pareja sigue las tarjetas sin recibir correcciones.</text>
</svg>
