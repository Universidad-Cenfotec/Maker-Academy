<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Ficha de prueba de B09</title>
  <desc id="desc">Ficha imprimible con cuatro casillas con líneas para escribir o dibujar: pensamos que, para la predicción; ocurrió, para lo observado por otra persona; cambiamos, para una sola modificación; y al probar de nuevo, para revisar si mejoró. Abajo, espacios para equipo, nivel, fecha y herramienta.</desc>
  <rect width="1200" height="500" fill="#9CC8FF"/>
  <text x="48" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#164A98">Ficha de prueba de B09</text>
  <text x="48" y="86" font-family="Arial, sans-serif" font-size="17" fill="#164A98">Para imprimir o proyectar · sirve con dibujo, explicación oral, bloques o código</text>
  <rect x="48" y="112" width="544" height="152" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <circle cx="92" cy="156" r="26" fill="#006AEA"/>
  <text x="92" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">?</text>
  <text x="132" y="152" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#164A98" text-anchor="start">1 · Pensamos que…</text>
  <text x="132" y="176" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#006AEA" text-anchor="start">Predicción antes de ejecutar</text>
  <line x1="72" y1="216" x2="568" y2="216" stroke="#D2D2D2" stroke-width="2"/>
  <line x1="72" y1="246" x2="568" y2="246" stroke="#D2D2D2" stroke-width="2"/>
  <rect x="608" y="112" width="544" height="152" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <circle cx="652" cy="156" r="26" fill="#164A98"/>
  <text x="652" y="164" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">◉</text>
  <text x="692" y="152" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#164A98" text-anchor="start">2 · Ocurrió…</text>
  <text x="692" y="176" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#006AEA" text-anchor="start">Lo que observó otra persona</text>
  <line x1="632" y1="216" x2="1128" y2="216" stroke="#D2D2D2" stroke-width="2"/>
  <line x1="632" y1="246" x2="1128" y2="246" stroke="#D2D2D2" stroke-width="2"/>
  <rect x="48" y="282" width="544" height="152" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <circle cx="92" cy="326" r="26" fill="#006AEA"/>
  <text x="92" y="334" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">↻</text>
  <text x="132" y="322" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#164A98" text-anchor="start">3 · Cambiamos…</text>
  <text x="132" y="346" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#006AEA" text-anchor="start">Una sola cosa, a propósito</text>
  <line x1="72" y1="386" x2="568" y2="386" stroke="#D2D2D2" stroke-width="2"/>
  <line x1="72" y1="416" x2="568" y2="416" stroke="#D2D2D2" stroke-width="2"/>
  <rect x="608" y="282" width="544" height="152" rx="16" fill="#F7F9FC" stroke="#164A98" stroke-width="2"/>
  <circle cx="652" cy="326" r="26" fill="#164A98"/>
  <text x="652" y="334" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text>
  <text x="692" y="322" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#164A98" text-anchor="start">4 · Al probar de nuevo…</text>
  <text x="692" y="346" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#006AEA" text-anchor="start">¿Mejoró? ¿Qué falta?</text>
  <line x1="632" y1="386" x2="1128" y2="386" stroke="#D2D2D2" stroke-width="2"/>
  <line x1="632" y1="416" x2="1128" y2="416" stroke="#D2D2D2" stroke-width="2"/>
