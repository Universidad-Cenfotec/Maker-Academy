<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volcán Poás vivo: proyección</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
  #panel { position: fixed; top: 8px; left: 8px; color: #ddd; font-size: 13px; z-index: 2; background: rgba(0,0,0,.6); padding: 8px; border-radius: 6px; }
  button { font-size: 14px; }
</style>
</head>
<body>
<div id="panel">
  <button id="conectar">Conectar IdeaBoard</button>
  <div>M: ajustar esquinas &nbsp; E: erupción &nbsp; F: pantalla completa &nbsp; H: ocultar este panel</div>
</div>
<script>
// ===== Proyecto 7: Volcán Poás vivo. Proyección con ajuste de esquinas =====
// La escena se dibuja en una imagen y se "pega" sobre un cuadrilátero con 4 esquinas
// que se arrastran con el mouse hasta calzar con la maqueta (projection mapping sencillo).
const DURACION = 15000;          // ms de erupción
let escena, esquinas, ajustando = false, arrastrando = -1;
let erupcionDesde = -1e9;
let vapor = [], ceniza = [], rocas = [];
let audio, ruido;

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  escena = createGraphics(1280, 720);
  esquinas = cargarEsquinas() || [[-0.35, -0.35], [0.35, -0.35], [0.35, 0.35], [-0.35, 0.35]];
  document.getElementById("conectar").onclick = conectar;
  textureMode(NORMAL);
}

// ---------- Esquinas (se guardan en este navegador) ----------
function cargarEsquinas() {
  try { return JSON.parse(localStorage.getItem("poas-esquinas")); } catch (e) { return null; }
}
function guardarEsquinas() {
  try { localStorage.setItem("poas-esquinas", JSON.stringify(esquinas)); } catch (e) {}
}
function aPantalla(e) { return [e[0] * width, e[1] * height]; }

function mousePressed() {
  if (!ajustando) return;
  const mx = mouseX - width / 2, my = mouseY - height / 2;
  esquinas.forEach((e, i) => { const p = aPantalla(e); if (dist(mx, my, p[0], p[1]) < 30) arrastrando = i; });
}
function mouseDragged() {
  if (arrastrando >= 0) esquinas[arrastrando] = [(mouseX - width / 2) / width, (mouseY - height / 2) / height];
}
function mouseReleased() { if (arrastrando >= 0) guardarEsquinas(); arrastrando = -1; }

function keyPressed() {
  if (key === "m" || key === "M") ajustando = !ajustando;
  if (key === "e" || key === "E") iniciarErupcion();
  if (key === "f" || key === "F") fullscreen(!fullscreen());
  if (key === "h" || key === "H") { const p = document.getElementById("panel"); p.style.display = p.style.display === "none" ? "" : "none"; }
}
function windowResized() { resizeCanvas(windowWidth, windowHeight); }

// ---------- Conexión con la IdeaBoard (Web Serial, Chrome o Edge) ----------
async function conectar() {
  if (!("serial" in navigator)) { alert("Use Chrome o Edge."); return; }
  const puerto = await navigator.serial.requestPort();
  await puerto.open({ baudRate: 115200 });
  const lector = puerto.readable.pipeThrough(new TextDecoderStream()).getReader();
  let resto = "";
  while (true) {
    const { value, done } = await lector.read();
    if (done) break;
    resto += value;
    const lineas = resto.split("\n");
    resto = lineas.pop();
    for (const l of lineas) if (l.trim() === "ERUPCION") iniciarErupcion();
  }
}

// ---------- Sonido: retumbo con ruido filtrado ----------
function retumbo(segundos) {
  audio = audio || new (window.AudioContext || window.webkitAudioContext)();
  const n = audio.sampleRate * segundos, buf = audio.createBuffer(1, n, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.min(1, (n - i) / (audio.sampleRate * 3));
  const src = audio.createBufferSource(), f = audio.createBiquadFilter(), g = audio.createGain();
  src.buffer = buf; f.type = "lowpass"; f.frequency.value = 120; g.gain.value = 0.9;
  src.connect(f); f.connect(g); g.connect(audio.destination); src.start();
}

function iniciarErupcion() {
  if (millis() - erupcionDesde < DURACION) return;
  erupcionDesde = millis();
  try { retumbo(DURACION / 1000); } catch (e) {}
  for (let i = 0; i < 25; i++) rocas.push({ x: 640, y: 420, vx: random(-9, 9), vy: random(-22, -10) });
}

// ---------- Escena ----------
function dibujarEscena() {
  const g = escena, t = millis() / 1000;
  const enErupcion = millis() - erupcionDesde < DURACION;
  const fuerza = enErupcion ? sin(PI * (millis() - erupcionDesde) / DURACION) : 0;
  g.background(25, 22, 20);
  // paredes del cráter
  g.noStroke();
  for (let r = 0; r < 8; r++) { g.fill(140 - r * 11, 125 - r * 10, 110 - r * 9); g.ellipse(640, 420, 1100 - r * 90, 600 - r * 50); }
  // laguna ácida (turquesa en calma, gris en erupción)
  const lago = lerpColor(color(70, 200, 190), color(120, 120, 115), fuerza);
  g.fill(lago); g.ellipse(640, 430, 360 + sin(t) * 6, 180 + cos(t) * 4);
  g.stroke(255, 255, 255, 60); g.noFill();
  for (let k = 0; k < 3; k++) { const rr = (t * 40 + k * 60) % 180; g.ellipse(640, 430, rr * 2, rr); }
  g.noStroke();
  // fumarolas
  if (random() < 0.3) vapor.push({ x: 640 + random(-150, 150), y: 430, a: 120, s: random(20, 40) });
  // ceniza en erupción
  if (enErupcion) for (let i = 0; i < 12 * fuerza; i++) ceniza.push({ x: 640 + random(-40, 40), y: 420, vx: random(-1.5, 1.5), vy: random(-9, -4) * (0.5 + fuerza), a: 220, s: random(30, 70) });
  for (const v of vapor) { v.y -= 1.2; v.x += sin(t + v.y * 0.02) * 0.6; v.a -= 1.2; v.s += 0.4; g.fill(240, 240, 240, v.a); g.circle(v.x, v.y, v.s); }
  for (const c of ceniza) { c.x += c.vx; c.y += c.vy; c.vy += 0.05; c.a -= 1.3; c.s += 0.8; g.fill(90, 85, 80, c.a); g.circle(c.x, c.y, c.s); }
  for (const r of rocas) { r.x += r.vx; r.y += r.vy; r.vy += 0.6; g.fill(255, 120, 30); g.circle(r.x, r.y, 10); }
  vapor = vapor.filter(v => v.a > 0); ceniza = ceniza.filter(c => c.a > 0); rocas = rocas.filter(r => r.y < 760);
  // destello
  if (enErupcion && random() < 0.05) { g.fill(255, 230, 200, 120); g.rect(0, 0, 1280, 720); }
  // borde negro alrededor del cráter para que no se proyecte fuera de la maqueta
  g.noFill(); g.stroke(0); g.strokeWeight(220); g.ellipse(640, 420, 1340, 840);
}

function draw() {
  background(0);
  dibujarEscena();
  noStroke();
  texture(escena);
  const p = esquinas.map(aPantalla);
  beginShape();
  vertex(p[0][0], p[0][1], 0, 0, 0);
  vertex(p[1][0], p[1][1], 0, 1, 0);
  vertex(p[2][0], p[2][1], 0, 1, 1);
  vertex(p[3][0], p[3][1], 0, 0, 1);
  endShape(CLOSE);
  if (ajustando) {
    stroke(255, 255, 0); strokeWeight(2); noFill();
    beginShape(); for (const q of p) vertex(q[0], q[1]); endShape(CLOSE);
    for (const q of p) { fill(255, 255, 0); circle(q[0], q[1], 22); noFill(); }
  }
}
</script>
</body>
</html>
